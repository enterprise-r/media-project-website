    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {

      background: var(--bg);
      color: var(--fg);

      flex-direction: column;
      overflow: hidden;

    header, footer { padding: 10px 20px; }
    header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      border-top: 4px solid transparent;
      border-image: linear-gradient(90deg, #F4B965, #BA9EDA 33%, #77AF8A 75%) 1;

    h1 {
      margin: 0;
      font-family: Audiowide, Rajdhani, sans-serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--bright);
      letter-spacing: 0.01em;

    .when {
      margin-left: auto;
      font-family: "Monaspace Neon", ui-monospace, monospace;
      font-size: 18px;
      color: var(--clock);
      font-variant-numeric: tabular-nums;
    }
    .when span { color: var(--green); font-size: 12px; margin-left: 8px; }
    .count {
      font-family: "Monaspace Neon", ui-monospace, monospace;
      color: var(--dim);
      font-size: 13px;
    }
    .stage {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 8px 12px 16px;
    }
    .fit {
      position: relative;
      width: min(1440px, 100%);
      margin: 0 auto;
      background: var(--bg);
    }
    /* In-flow box. The SVG layers are absolute, so they cannot give this a height. */
    .fit::before {
      content: "";
      display: block;
      padding-top: 155.833%;
    }
    .fit object {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      background: var(--bg);
      transition: opacity 280ms linear;
    }
    .fit object.on { opacity: 1; }
    footer { border-top: 1px solid var(--line); }
    #prompt {
      margin: 0 0 10px;
      min-height: 2.8em;
      font-size: 16px;
      line-height: 1.4;
      color: var(--fg);
    }
    .bar { display: flex; gap: 8px; align-items: center; }
    .dots { display: flex; gap: 4px; flex: 1; min-width: 0; }
    .dots button {
      flex: 1;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: var(--line);
      cursor: pointer;
    }
    .dots button[data-state="done"] { background: var(--green); }
    .dots button[aria-current="true"] { background: var(--gold); }
    button.ctl {
      font-family: Rajdhani, sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--bright);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 14px;
      cursor: pointer;
    }
    button.ctl:hover, button.ctl:focus-visible { border-color: var(--gold); outline: none; }
    button.ctl:disabled { opacity: 0.35; cursor: default; }
    .hint {
      margin: 8px 0 0;
      color: var(--dim);
      font-family: Rajdhani, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Update glow from the company theme. .r-glow lights the whole border at once.
       .r-glow-run carries a band of the stripe twice around the border. */
    :root {
      --ui-orange: #F4B965;
      --ui-magenta: #BA9EDA;
      --ui-green: #77AF8A;
      --ui-striped: linear-gradient(to top right,
        var(--ui-orange) 0%,
        var(--ui-magenta) 33%,
        var(--ui-green) 75%,
        var(--ui-green) 100%);
      --r-glow-r: 8px;
      --r-glow-w: 2px;
      --r-glow-halo: 14px;
      --r-glow-time: 1.6s;
      --r-glow-run-time: 4s;
      --r-glow-reach: 20px;
    }
    @property --r-glow-a {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }
    :where(.r-glow, .r-glow-run) { position: relative; }
    .r-glow::before, .r-glow::after,
    .r-glow-run::before, .r-glow-run::after {
      content: "";
      position: absolute;
      pointer-events: none;
      opacity: 0;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    }
    .r-glow::after, .r-glow-run::after {
      inset: calc(-1 * var(--r-glow-w));
      padding: var(--r-glow-w);
      border-radius: calc(var(--r-glow-r) + var(--r-glow-w));
    }
    .r-glow::before, .r-glow-run::before {
      inset: calc(-1 * var(--r-glow-halo));
      border: var(--r-glow-halo) solid transparent;
      border-radius: calc(var(--r-glow-r) + var(--r-glow-halo));
      background-clip: padding-box;
      filter: blur(calc(var(--r-glow-halo) / 2));
      -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0);
    }
    .r-glow::before, .r-glow::after {
      background-image: var(--ui-striped);
      animation: r-glow-flash var(--r-glow-time) ease-out;
    }
    .r-glow::before { animation-name: r-glow-flash-halo; }
    .r-glow-run::before, .r-glow-run::after {
      background-image: conic-gradient(from var(--r-glow-a),
        transparent 0 55%,
        var(--ui-orange) 70%,
        var(--ui-magenta) 83%,
        var(--ui-green) 95%,
        transparent 100%);
      animation: r-glow-run var(--r-glow-run-time) linear;
    }
    @keyframes r-glow-flash {
      0% { opacity: 0; }
      15% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes r-glow-flash-halo {
      0% { opacity: 0; }
      15% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes r-glow-run {
      0% { --r-glow-a: 0deg; opacity: 0; }
      5% { opacity: 1; }
      92% { opacity: 1; }
      100% { --r-glow-a: 720deg; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .r-glow-run::before, .r-glow-run::after {
        background-image: var(--ui-striped);
        animation-name: r-glow-flash;
      }
    }
    .glows {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .glows .hot {
      position: absolute;
      pointer-events: none;
      border-radius: 8px;
      --r-glow-r: 8px;
    }
    .glows .hot.pill {
      border-radius: 6px;
      --r-glow-r: 6px;
    }
    @media (max-width: 720px) {
      header { flex-wrap: wrap; gap: 6px 12px; }
      .when { margin-left: 0; }
      h1 { font-size: 18px; }
      #prompt { font-size: 15px; }
      .hint { display: none; }
    }
  </style>

  <script>
    const FRAMES = JSON.parse(document.getElementById("frames").textContent);

      [["web", "once"], ["prod", "around"]],
      [["parent", "once"]],
      [["docs26", "once"]],
      [["rmedia", "once"]],

    const glows = document.getElementById("glows");
    const hot = {};
    for (const [key, box] of Object.entries(BOX)) {
      const el = document.createElement("div");
      el.className = "hot" + (key === "pill" ? " pill" : "");
      const [x, y, w, h] = box;

    function seconds(hhmmss) {
      const [h, m, s] = hhmmss.split(":").map(Number);
      return h * 3600 + m * 60 + s;
    }

    /* Hold scales with the real gap, from about 1.1s to 5.5s. The 11:36 burst stays quick. */
    function dwell(i) {
      if (i >= FRAMES.length - 1) return 0;
      const gap = Math.max(1, seconds(FRAMES[i + 1].time) - seconds(FRAMES[i].time));
      const t = Math.log10(gap) / Math.log10(7.5 * 3600);
      let ms = Math.round(1100 + Math.min(Math.max(t, 0), 1) * 4400);
      if (GLOW[i].some(([, kind]) => kind === "around")) ms = Math.max(ms, 4300);
      return ms;
    }

    function fileOf(node) {
      try { return new URL(node.data, location.href).pathname.split("/").pop(); }
      catch (e) { return ""; }
    }

    function paint() {
      const frame = FRAMES[index];
      prompt.textContent = frame.prompt;
      clock.textContent = frame.time;
      count.textContent = String(index + 1).padStart(2, "0") + " / " + String(FRAMES.length).padStart(2, "0");
      document.title = "www-split " + frame.time;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === FRAMES.length - 1;
      const atEnd = index === FRAMES.length - 1;
      playBtn.textContent = playing ? "Pause" : (atEnd ? "Replay" : "Play");
      [...dots.children].forEach((dot, n) => {
        dot.setAttribute("aria-current", n === index ? "true" : "false");
        dot.dataset.state = n < index ? "done" : "";
      });
      if (location.hash !== "#" + frame.file.slice(0, 2)) {
        history.replaceState(null, "", "#" + frame.file.slice(0, 2));
      }
      const stage = document.querySelector(".stage");
      const fit = document.getElementById("fit");
      const top = fit.offsetHeight * FOCUS[index] - stage.clientHeight * 0.38;
      stage.scrollTo({ top: Math.max(0, top), behavior: "auto" });
      for (const el of Object.values(hot)) el.classList.remove("r-glow", "r-glow-run");
      void glows.offsetWidth;
      for (const [key, kind] of GLOW[index]) {
        hot[key].classList.add(kind === "around" ? "r-glow-run" : "r-glow");
      }
    }

    function schedule() {
      clearTimeout(timer);
      if (!playing) return;
      const ms = dwell(index);
      if (!ms) {
        playing = false;
        paint();
        return;
      }
      timer = setTimeout(() => go(index + 1), ms);
    }

    function go(next) {
      next = Math.max(0, Math.min(FRAMES.length - 1, next));
      const my = ++token;
      const frame = FRAMES[next];
      const back = front === a ? b : a;
      const reveal = () => {
        if (my !== token) return;
        index = next;
        back.classList.add("on");
        front.classList.remove("on");
        front = back;
        paint();
        schedule();
      };
      let ready = false;
      try {
        ready = fileOf(back) === frame.file && !!back.contentDocument && !!back.contentDocument.documentElement;
      } catch (e) {
        ready = false;
      }
      if (ready) {
        reveal();
        return;
      }
      back.onload = () => {
        if (fileOf(back) !== frame.file) return;
        back.onload = null;
        reveal();
      };
      back.data = frame.file;
    }

    FRAMES.forEach((frame, n) => {
      const dot = document.createElement("button");
      dot.type = "button";
      dot.setAttribute("aria-label", frame.time + " CET");
      dot.addEventListener("click", () => {
        playing = false;
        clearTimeout(timer);
        go(n);
      });
      dots.appendChild(dot);
    });

    playBtn.addEventListener("click", () => {
      if (playing) {
        playing = false;
        clearTimeout(timer);
        paint();
        return;
      }
      playing = true;
      if (index === FRAMES.length - 1) go(0);
      else schedule();
    });
    prevBtn.addEventListener("click", () => { playing = false; clearTimeout(timer); go(index - 1); });
    nextBtn.addEventListener("click", () => { playing = false; clearTimeout(timer); go(index + 1); });
    document.addEventListener("keydown", (event) => {
      if (event.target instanceof HTMLTextAreaElement || event.target instanceof HTMLInputElement) return;
      if (event.key === " ") { event.preventDefault(); playBtn.click(); }
      else if (event.key === "ArrowRight") { event.preventDefault(); nextBtn.click(); }
      else if (event.key === "ArrowLeft") { event.preventDefault(); prevBtn.click(); }
    });

    function start() {
      const hash = /^#(\d{2})$/.exec(location.hash);
      const startAt = hash ? Math.min(FRAMES.length - 1, Math.max(0, Number(hash[1]) - 1)) : 0;
      if (startAt === 0) {
        playing = !reduced;
        paint();
        requestAnimationFrame(() => paint());
        if (playing) schedule();
      } else {
        playing = false;
        go(startAt);
      }
    }

    if (document.fonts && document.fonts.ready) document.fonts.ready.then(start);
    else start();
  </script>
</body>
</html>
